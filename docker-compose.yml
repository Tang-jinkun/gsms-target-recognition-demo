services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gsms
      POSTGRES_USER: gsms
      POSTGRES_PASSWORD: gsms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsms -d gsms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${GSMS_BACKEND_BIND:-127.0.0.1}:${GSMS_BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/workspace/backend/data
    environment:
      DATABASE_URL: "postgresql+psycopg2://gsms:gsms@db:5432/gsms"
      FERNET_KEY: "${GSMS_FERNET_KEY:?Run scripts/start_docker_gsms.sh to initialize .env}"
      GSMS_AGENT_PROXY_TOKEN: "${GSMS_AGENT_PROXY_TOKEN:?Run scripts/start_docker_gsms.sh to initialize .env}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "micromamba run -n gsms-invest python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        INTERNAL_API_URL: "http://backend:8000"
        NPM_REGISTRY: "https://registry.npmjs.org/"
    environment:
      # Runtime backend URL for the SSE proxy API route (real-time streaming
      # that the buffered next.config rewrites cannot do).
      INTERNAL_API_URL: "http://backend:8000"
    ports:
      - "${GSMS_FRONTEND_BIND:-0.0.0.0}:${GSMS_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  agent-worker:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      GSMS_URL: "http://backend:8000"
      GSMS_AGENT_PROXY_TOKEN: "${GSMS_AGENT_PROXY_TOKEN:?Run scripts/start_docker_gsms.sh to initialize .env}"
      INVEST_AGENT_WORKSPACE: "/workspace/agent-data"
      INVEST_AGENT_WORKER_POLL_MS: "${INVEST_AGENT_WORKER_POLL_MS:-1500}"
    volumes:
      - agent-data:/workspace/agent-data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-data:
  backend-data:
  pgdata:
