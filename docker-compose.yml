services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gsms
      POSTGRES_USER: gsms
      POSTGRES_PASSWORD: gsms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsms -d gsms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/workspace/backend/data
    environment:
      DATABASE_URL: "postgresql+psycopg2://gsms:gsms@db:5432/gsms"
      FERNET_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "micromamba run -n gsms-invest python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        INTERNAL_API_URL: "http://backend:8000"
        NPM_REGISTRY: "https://registry.npmjs.org/"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  pgdata:
